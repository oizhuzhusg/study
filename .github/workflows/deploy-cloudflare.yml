name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check syntax
        run: npm run check

      - name: Cloudflare deploy skipped
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: echo "::notice title=Cloudflare deploy skipped::Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets, then rerun this workflow."

      - name: Deploy staging
        if: github.ref_name == 'develop' && env.HAS_CLOUDFLARE_SECRETS == 'true'
        run: npm run deploy:staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy production
        if: github.ref_name == 'main' && env.HAS_CLOUDFLARE_SECRETS == 'true'
        run: npm run deploy:production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
